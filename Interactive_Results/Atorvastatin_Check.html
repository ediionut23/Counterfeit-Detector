    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #0f1014; color: white; overflow: hidden; }
        #viewport { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        
        /* OVERLAY UI */
        #ui-layer { position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; }
        
        .card {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* HEADER */
        #header {
            position: absolute; top: 20px; left: 20px;
            width: 300px;
        }
        h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .badge { 
            display: inline-block; padding: 4px 12px; border-radius: 20px; 
            font-size: 12px; font-weight: bold; text-transform: uppercase;
            background: #2ed573; color: #000; margin-top: 5px;
        }

        /* DETAIL PANEL (Right) */
        #details {
            position: absolute; top: 20px; right: 20px;
            width: 280px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #details.active { transform: translateX(0); }
        
        .stat-box {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
        }
        .label { font-size: 11px; color: #888; text-transform: uppercase; }
        .value { font-size: 16px; font-weight: 600; color: #fff; }
        .highlight { color: #ff9f43; }

        /* CONTROLS (Bottom) */
        #controls {
            position: absolute; bottom: 30px; left: 50%; 
            transform: translateX(-50%);
            display: flex; gap: 10px;
        }
        button {
            background: #2f3542; color: white; border: 1px solid #57606f;
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: all 0.2s;
            pointer-events: auto;
        }
        button:hover { background: #fff; color: #000; }

    </style>
</head>

        </div>

            <div style="font-size:11px; color:#666; margin-top:15px; line-height:1.4;">
                * Focusing on this group helps visualize the specific substructure driving the prediction.
            </div>
        </div>

        <div id="controls">
            <button onclick="resetView()">Reset View</button>
            <button onclick="toggleSpin()">Toggle Spin</button>
        </div>

        $(document).ready(function() {
            viewer = $3Dmol.createViewer($('#viewport'), { backgroundColor: '#0f1014' });
            viewer.addModel(molBlock, "mol");
            
            // Initial Render: Rank Based Coloring
            renderDefaultView();
            
            viewer.zoomTo();
            viewer.render();

            // --- CLICK HANDLER ---
            viewer.setClickable({}, true, function(atom) {
                if(!atomData[atom.serial]) return;
                let data = atomData[atom.serial];
                
                // 1. UPDATE UI
                $('#details').addClass('active');
                $('#d-rank').text("#" + data.rank);
                $('#d-group').text(data.group_name);
                $('#d-score').text(data.score);
                
                // 2. ISOLATE GROUP (Ghosting Effect)
                isolateGroup(data.group_indices);

                // 3. ZOOM TRANSITION
                let atomList = data.group_indices; 
                let selection = {serial: atomList};
                viewer.zoomTo(selection, 800); 
            });
        });

        function renderDefaultView() {
            // Apply standard ranking colors
            for(let id in atomData) {
                let d = atomData[id];
                viewer.setStyle({serial: parseInt(id)}, {
                    stick: {color: d.color, radius: 0.15},
                    sphere: {color: d.color, scale: 0.35}
                });
            }
            viewer.render();
        }

        function isolateGroup(indices) {
            // 1. Ghost everything (Translucent Grey)
            viewer.setStyle({}, {
                stick: {color: '#444', radius: 0.1, opacity: 0.1},
                sphere: {hidden: true}
            });

            // 2. Highlight Group (Thick & Colorful)
            for(let i=0; i<indices.length; i++) {
                let idx = indices[i];
                let d = atomData[idx];
                
                viewer.setStyle({serial: idx}, {
                    stick: {color: d.color, radius: 0.3},
                    sphere: {color: d.color, scale: 0.5}
                });
            }
            viewer.render();
        }

        function resetView() {
            $('#details').removeClass('active');
            renderDefaultView();
            viewer.zoomTo({}, 800); 
        }

        function toggleSpin() {
            isSpinning = !isSpinning;
            viewer.spin(isSpinning);
        }
