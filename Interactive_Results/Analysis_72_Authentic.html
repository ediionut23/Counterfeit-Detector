
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaAI Investigator</title>

  <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --card: rgba(255,255,255,0.92);
      --card2: rgba(250,250,250,0.92);
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #viewport {
      width: 100%;
      height: 100vh;
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #fff;
    }

    .panel {
      position: absolute;
      z-index: 10;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    #header {
      top: 18px;
      left: 18px;
      width: 320px;
      display: grid;
      gap: 10px;
    }
    .subtitle {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #000;
      line-height: 1.1;
    }
    .pred-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #16a34a33;
      background: #16a34a14;
      color: #16a34a;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 12px;
    }
    .pred-badge span {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: #111827;
      text-transform: none;
      font-size: 12px;
    }

    #stats {
      bottom: 18px;
      left: 18px;
      width: 320px;
      display: grid;
      gap: 10px;
      background: var(--card2);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-item {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #000;
      line-height: 1.2;
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      font-weight: 700;
    }

    .heatmap-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .heatmap-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .heatmap-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
    }
    .heatmap-hint {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    #heatmap-container {
      width: 100%;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      padding: 8px;
    }
    #heatmap-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 10px;
    }

    #inspector {
      top: 18px;
      right: 18px;
      width: 340px;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.28s ease, opacity 0.28s ease;
    }
    #inspector.active {
      transform: translateX(0);
      opacity: 1;
    }
    .ins-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .rank-circle {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 14px;
      border: 3px solid #d1d5db;
      color: #111827;
      flex: 0 0 auto;
    }
    .group-cap {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
    }
    #group-name {
      font-size: 15px;
      font-weight: 900;
      color: #000;
      margin-top: 2px;
    }
    .props {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .prop-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .prop-row:last-child { border-bottom: none; }
    .prop-key {
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .prop-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #000;
      text-align: right;
      font-weight: 700;
      max-width: 58%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #p-score {
      color: #b91c1c;
      font-weight: 900;
    }

    #controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #fff;
      border: 1px solid var(--border);
      color: #111827;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .btn:hover {
      background: #f9fafb;
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }

    #hm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    #hm-modal.active { display: flex; }
    #hm-card {
      width: min(980px, 96vw);
      height: min(720px, 92vh);
      background: #fff;
      border-radius: 16px;
      border: 1px solid #ddd;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      display: grid;
      grid-template-rows: auto 1fr;
    }
    #hm-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
      font-weight: 900;
    }
    #hm-close {
      border: 1px solid #eee;
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 900;
    }
    #hm-full {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    @media (max-width: 860px) {
      #inspector { display: none; }
    }
  </style>
</head>

<body>
  <div id="viewport"></div>

  <div id="header" class="panel">
    <div class="subtitle">AI Forensics Module</div>
    <h1>Molecule Analysis</h1>
    <div class="pred-badge">
      Authentic
      <span>72.19%</span>
    </div>
  </div>

  <div id="stats" class="panel">
    <div class="stat-grid">
      <div class="stat-item"><div class="stat-val">608.64</div><div class="stat-lbl">MW</div></div>
      <div class="stat-item"><div class="stat-val">3.46</div><div class="stat-lbl">LogP</div></div>
      <div class="stat-item"><div class="stat-val">182.93</div><div class="stat-lbl">TPSA</div></div>
      <div class="stat-item"><div class="stat-val">5/10</div><div class="stat-lbl">HBD/HBA</div></div>
    </div>

    <div class="heatmap-wrap">
      <div class="heatmap-head">
        <div class="heatmap-title">2D Importance Heatmap</div>
        <div class="heatmap-hint">Click to zoom</div>
      </div>
      <div id="heatmap-container" title="Click to zoom">
        <img id="heatmap-img" src="" alt="2D Heatmap" />
      </div>
    </div>
  </div>

  <div id="inspector" class="panel">
    <div class="ins-row">
      <div id="atom-rank" class="rank-circle">#</div>
      <div>
        <div class="group-cap">Selected Group</div>
        <div id="group-name">-</div>
      </div>
    </div>

    <div class="props">
      <div class="prop-row"><span class="prop-key">Element</span><span id="p-elem" class="prop-val">-</span></div>
      <div class="prop-row"><span class="prop-key">Hybridization</span><span id="p-hyb" class="prop-val">-</span></div>
      <div class="prop-row"><span class="prop-key">Charge</span><span id="p-chg" class="prop-val">-</span></div>
      <div class="prop-row"><span class="prop-key">Chirality</span><span id="p-chir" class="prop-val">-</span></div>
      <div class="prop-row"><span class="prop-key">Neighbors</span><span id="p-nbr" class="prop-val">-</span></div>
      <div class="prop-row"><span class="prop-key">Importance</span><span id="p-score" class="prop-val">-</span></div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" onclick="resetView()">Reset View</button>
    <button class="btn" onclick="toggleSpin()">Auto-Rotate</button>
    <button class="btn" onclick="toggleFocus()">Focus Mode</button>
  </div>

  <div id="hm-modal" onclick="closeHeatmap(event)">
    <div id="hm-card" onclick="event.stopPropagation()">
      <div id="hm-bar">
        <div>2D Heatmap</div>
        <button id="hm-close" onclick="closeHeatmap(event)">Close</button>
      </div>
      <img id="hm-full" src="" alt="Heatmap Full" />
    </div>
  </div>

    let viewer = null;
    let isSpinning = false;
    let focusMode = false;

    // Strict style constants (default look)
    const TOP_SPHERE = 0.38;
    const TOP_STICK_R = 0.18;

    function openHeatmap() {
      document.getElementById('hm-modal').classList.add('active');
    }
    function closeHeatmap(e) {
      if (e) e.preventDefault();
      document.getElementById('hm-modal').classList.remove('active');
    }

    function applyBaseStyle() {
      // Base: light grey, semi-transparent so selection is obvious
      viewer.setStyle({}, {
        stick: { radius: 0.11, color: '#d6d6d6', opacity: 0.55 },
        sphere: { scale: 0.16, color: '#d6d6d6', opacity: 0.45 }
      });
    }

    function applyTopHighlights() {
      // Top 5: colored spheres+sticks, fully visible
      for (let id in atomData) {
        const d = atomData[id];
        if (d.rank <= 5) {
          viewer.setStyle({ serial: parseInt(id) }, {
            stick: { color: d.color, radius: TOP_STICK_R, opacity: 1.0 },
            sphere: { color: d.color, scale: TOP_SPHERE, opacity: 1.0 }
          });
        }
      }
    }

    function renderDefault() {
      applyBaseStyle();
      applyTopHighlights();
      viewer.render();
    }

    function highlightGroup(grp, color) {
      // 1) Wash out everything else HARD
      viewer.setStyle({}, {
        stick: { radius: 0.09, color: '#dcdcdc', opacity: 0.18 },
        sphere: { scale: 0.12, color: '#dcdcdc', opacity: 0.10 }
      });

      // 2) Selected group = BIG + thick + opaque
      viewer.setStyle({ serial: grp }, {
        stick: { color: color, radius: 0.34, opacity: 1.0 },
        sphere: { color: color, scale: 0.62, opacity: 1.0 }
      });

      // 3) Subtle neighborhood emphasis
      viewer.setStyle({ within: { serial: grp, distance: 1.15 } }, {
        stick: { color: '#bfbfbf', radius: 0.13, opacity: 0.30 }
      });

      viewer.render();
      viewer.zoomTo({ serial: grp }, 520);

      // 4) Quick pulse
      setTimeout(() => {
        viewer.setStyle({ serial: grp }, {
          stick: { color: color, radius: 0.30, opacity: 1.0 },
          sphere: { color: color, scale: 0.55, opacity: 1.0 }
        });
        viewer.render();
      }, 120);
    }

    function updateInspector(d) {
      $('#inspector').addClass('active');
      $('#atom-rank').text("#" + d.rank).css('border-color', d.color);
      $('#group-name').text(d.group_name);

      $('#p-elem').text(d.symbol + " (" + d.index + ")");
      $('#p-hyb').text(d.properties.Hybridization);
      $('#p-chg').text(d.properties.Charge);
      $('#p-chir').text(d.properties.Chirality);
      $('#p-nbr').text(d.properties.Neighbors);
      $('#p-score').text(d.score);
    }

    function getAtomDataFrom3Dmol(atom) {
      // Some models are 1-based serial; fallback to serial-1 if needed
      const s = atom.serial;
      if (atomData[s]) return atomData[s];
      if (atomData[s - 1]) return atomData[s - 1];
      return null;
    }

    $(document).ready(function() {
      viewer = $3Dmol.createViewer($('#viewport'), { backgroundColor: 'white' });
      viewer.addModel(molBlock, "mol");

      renderDefault();
      viewer.zoomTo();
      viewer.render();

      viewer.setClickable({}, true, function(atom) {
        const d = getAtomDataFrom3Dmol(atom);
        if (!d) return;
        updateInspector(d);
        highlightGroup(d.group_indices, d.color);
      });

      $('#heatmap-container').on('click', openHeatmap);

      $(document).on('keydown', function(e) {
        if (e.key === 'Escape') {
          closeHeatmap(e);
          resetView();
        }
        if (e.key.toLowerCase() === 'f') toggleFocus();
        if (e.key.toLowerCase() === 'r') resetView();
        if (e.key.toLowerCase() === 's') toggleSpin();
      });
    });

    function resetView() {
      $('#inspector').removeClass('active');
      renderDefault();
      viewer.zoomTo({}, 600);
    }

    function toggleSpin() {
      isSpinning = !isSpinning;
      viewer.spin(isSpinning);
    }

    function toggleFocus() {
      focusMode = !focusMode;

      // Focus mode here simply re-renders default base as stronger fade
      // Selection highlight still dominates, so it's fine.
      const isActive = $('#inspector').hasClass('active');
      if (!isActive) {
        renderDefault();
        return;
      }
    }
  </script>
