                body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: #1a1a1a; }
                #container { width: 100vw; height: 100vh; position: relative; }
                
                #info-panel {
                    position: absolute;
                    top: 20px;
                    right: 20px;
                    width: 300px;
                    background: rgba(255, 255, 255, 0.90);
                    border-radius: 12px;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                    padding: 20px;
                    transition: all 0.3s ease;
                    backdrop-filter: blur(10px);
                    border: 1px solid rgba(255,255,255,0.2);
                    display: none;
                }
                
                #info-panel.visible { display: block; animation: slideIn 0.3s ease-out; }
                
                @keyframes slideIn {
                    from { opacity: 0; transform: translateX(20px); }
                    to { opacity: 1; transform: translateX(0); }
                }

                h2 { margin-top: 0; color: #333; font-size: 18px; border-bottom: 2px solid #ff4757; padding-bottom: 10px; }
                
                .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; }
                .stat-label { font-weight: 600; color: #666; }
                .stat-value { font-weight: 700; color: #2f3542; }
                
                .rank-badge { 
                    background: #ff4757; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
                    display: inline-block; margin-bottom: 10px;
                }
                
                #group-name { color: #1e90ff; font-weight: bold; font-size: 15px; margin-top: 5px; }
                
                .instruction {
                    position: absolute;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    color: rgba(255,255,255,0.6);
                    font-size: 14px;
                    pointer-events: none;
                    text-align: center;
                }
            </style>
        </head>
